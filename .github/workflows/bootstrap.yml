name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devguide
          POSTGRES_PASSWORD: devguide
          POSTGRES_DB: devguide
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devguide -d devguide"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEVGUIDE_DATABASE_URL: postgresql+asyncpg://devguide:devguide@localhost:5432/devguide
      DEVGUIDE_AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - working-directory: apps/api
        run: python -m pip install -e '.[dev]'
      - working-directory: apps/api
        run: python -m ruff format --check .
      - working-directory: apps/api
        run: python -m ruff check .
      - working-directory: apps/api
        run: python -m mypy app tests
      - working-directory: apps/api
        run: python -m pytest
      - name: Upgrade and verify migration head
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          test "$(python -m alembic heads | awk '{print $1}')" = "$(python -m alembic current | awk '{print $1}')"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run format:check
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run test -- --run
      - working-directory: apps/web
        run: npm run build

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git diff --check HEAD^
      - name: Reject tracked local/generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files '*.log' '*.dump' '*.sql' '.env' '.env.*' 'node_modules/**' 'dist/**' '**/__pycache__/**' 'playwright-report/**' 'test-results/**' |  || true)"
          test -z "$tracked" || { printf 'Tracked artifacts:\n%s\n' "$tracked"; exit 1; }
      - name: Reject common committed secret values
        shell: bash
        run: |grep -v -E '^\.env(\.[A-Za-z0-9_-]+)?\.example$'
          set -euo pipefail
          if git grep -I -n -E 'sk-ant-[A-Za-z0-9_-]{16,}|ANTHROPIC_API_KEY=[^[:space:]]{8,}|PRIVATE_TOKEN=[^[:space:]]{8,}|SESSION_TOKEN=[^[:space:]]{16,}' -- apps ':!apps/api/README.md' ':!**/*.test.*'; then
            echo 'Potential committed secret value detected.'
            exit 1
          fi
